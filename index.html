<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coffee Date? 💙</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #dff3ff, #a9dcff, #d9f1ff);
        overflow: hidden;
        color: #12395b;
    }

    .card {
        width: min(90%, 430px);
        padding: 42px 28px;
        text-align: center;
        background: rgba(255,255,255,0.85);
        border-radius: 30px;
        box-shadow: 0 20px 60px rgba(30, 120, 180, 0.2);
        backdrop-filter: blur(12px);
        animation: appear 0.8s ease;
    }

    .coffee {
        font-size: 65px;
        margin-bottom: 18px;
        animation: float 2.5s ease-in-out infinite;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 14px;
        color: #1675b9;
    }

    p {
        font-size: 17px;
        line-height: 1.6;
        margin-bottom: 28px;
        color: #42627d;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 13px 30px;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.25s ease;
    }

    .yes {
        background: #1675b9;
        color: white;
        box-shadow: 0 7px 18px rgba(22,117,185,0.3);
    }

    .yes:hover {
        transform: translateY(-3px) scale(1.04);
        background: #0d619c;
    }

    .no {
        background: #e8f5ff;
        color: #1675b9;
        border: 2px solid #b7ddf5;
    }

    .no:hover {
        transform: translateY(-3px);
    }

    .hidden {
        display: none;
    }

    .cat {
        font-size: 110px;
        margin-bottom: 15px;
        animation: bounce 1s infinite alternate;
    }

    .happy {
        font-size: 30px;
        color: #1675b9;
        margin-bottom: 10px;
    }

    .small {
        font-size: 15px;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(25px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes float {
        0%,100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-8px);
        }
    }

    @keyframes bounce {
        from {
            transform: translateY(0) rotate(-3deg);
        }
        to {
            transform: translateY(-12px) rotate(3deg);
        }
    }

    .heart {
        position: fixed;
        color: #5bb9ed;
        font-size: 20px;
        animation: rise 6s linear infinite;
        opacity: 0.5;
    }

    @keyframes rise {
        from {
            transform: translateY(100vh);
            opacity: 0;
        }
        20% {
            opacity: 0.6;
        }
        to {
            transform: translateY(-10vh);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<!-- Floating decorations -->
<div class="heart" style="left:10%; animation-delay:0s;">♡</div>
<div class="heart" style="left:25%; animation-delay:2s;">♡</div>
<div class="heart" style="left:70%; animation-delay:1s;">♡</div>
<div class="heart" style="left:88%; animation-delay:3s;">♡</div>


<!-- FIRST PAGE -->
<div class="buttons">

    <button class="yes" onclick="showCat()">
        YES ☕💙
    </button>

    <button class="no" onclick="showPage2()">
        NO 😭
    </button>

</div>


<!-- SECOND PAGE -->
<div class="card hidden" id="page2">

    <div class="coffee">🥺</div>

    <h1>Oh no...</h1>

    <p>
        I thought you loved me 😭
        <br>
        Okay okay, maybe just a little bit??
        <br><br>
        Try again and show me your luv. 💙
    </p>

    <div class="buttons">
        <button class="yes" onclick="showCat()">
            YES 💙
        </button>

        <button class="no" id="secondNo" onclick="changeNo()">
            NO 😭
        </button>
    </div>

</div>


<!-- HAPPY CAT PAGE -->
<div class="card hidden" id="page3">

    <div class="cat">😸</div>

    <div class="happy">
        YAYYYYY!! 💙
    </div>

    <p>
        Coffee date it is! ☕
        <br><br>
        I knew you couldn't say no forever 😭
        <br>
        See you soon! 💙
    </p>

</div>


<script>

function showPage2() {
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
}

function showCat() {
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.add("hidden");
    document.getElementById("page3").classList.remove("hidden");
}

function changeNo() {

    const button = document.getElementById("secondNo");

    button.innerHTML = "YES 💙";
    button.classList.remove("no");
    button.classList.add("yes");

    button.onclick = function() {
        showCat();
    };
}

</script>

</body>
</html>
